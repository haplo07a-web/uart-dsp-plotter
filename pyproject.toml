[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uartscope"
version = "0.1.0"
description = "Real-time serial (UART) plotter with live FFT, digital filters and CSV export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
uartscope = "uartscope.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
